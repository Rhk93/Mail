name: Compila Mail
on:
  push:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Estrai lo zip
        run: |
          Z=$(find . -iname "*.zip" -not -path "./.git/*" | head -1)
          echo "Zip trovato: $Z"
          if [ -n "$Z" ]; then unzip -o -q "$Z" -d progetto; else mkdir -p progetto && cp -r $(ls -A | grep -v -e '^.git$' -e '^progetto$') progetto/; fi
          echo "DIR=$(dirname "$(find progetto -name settings.gradle | head -1)")" >> $GITHUB_ENV
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.7'
      - name: Compila APK
        run: gradle assembleRelease --no-daemon
        working-directory: ${{ env.DIR }}
      - uses: actions/upload-artifact@v5
        with:
          name: Mail-APK
          path: ${{ env.DIR }}/app/build/outputs/apk/release/*.apk
