name: Compila Mail
on:
  push:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Estrai lo zip
        run: |
          unzip -o -q Mail.zip -d progetto
          echo "DIR=$(dirname "$(find progetto -name settings.gradle | head -1)")" >> $GITHUB_ENV
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Compila APK
        run: gradle assembleRelease --no-daemon
        working-directory: ${{ env.DIR }}
      - uses: actions/upload-artifact@v4
        with:
          name: Mail-APK
          path: ${{ env.DIR }}/app/build/outputs/apk/release/*.apk
